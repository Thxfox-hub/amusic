[package]
name = "ide-native"
version = "0.1.0"
edition = "2021"
description = "struIDEl native UI (egui), Strudel bridge TBD"

[dependencies]
eframe = "0.33"
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rfd = "0.14"
directories = "5"
egui_code_editor = { version = "0.2", default-features = false, features = ["editor", "egui"] }
cpal = "0.17.3"
hound = "3.5"
rustysynth = "1.3"
arc-swap = "1.9.1"
crossbeam-channel = "0.5.15"
tiny_http = "0.12"
tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "aiff", "alac", "caf"] }
signalsmith-stretch = "0.1.3"
